# LojaFácil - ambiente local completo
#   docker compose up --build
# Serviços:
#   frontend  http://localhost:4200  (Nginx servindo o Angular e repassando /api para o backend)
#   backend   http://localhost:8080  (Swagger em /swagger-ui.html)
#   mailpit   http://localhost:8025  (caixa de entrada de testes para e-mails de senha e convites)
#   postgres  localhost:5432
name: lojafacil

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-lojafacil}
      POSTGRES_USER: ${DB_USER:-lojafacil}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lojafacil}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lojafacil} -d ${DB_NAME:-lojafacil}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-lojafacil}
      DB_USER: ${DB_USER:-lojafacil}
      DB_PASSWORD: ${DB_PASSWORD:-lojafacil}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:4200}
      APP_PUBLIC_API_URL: ${APP_PUBLIC_API_URL:-http://localhost:8080}
      APP_CORS_ORIGINS: ${APP_FRONTEND_URL:-http://localhost:4200}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      APP_DEMO_MODE: ${APP_DEMO_MODE:-true}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_UPLOADS_DIR: /app/data/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/data/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  pgdata:
  uploads:
