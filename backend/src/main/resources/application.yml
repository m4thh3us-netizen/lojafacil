spring:
  application:
    name: lojafacil
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lojafacil}
    username: ${DB_USER:lojafacil}
    password: ${DB_PASSWORD:lojafacil}
    hikari:
      maximum-pool-size: 15
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${APP_COOKIE_SECURE:false}
        same-site: lax
        name: JSESSIONID

app:
  frontend-base-url: ${APP_FRONTEND_URL:http://localhost:4200}
  public-api-base-url: ${APP_PUBLIC_API_URL:http://localhost:8080}
  cors-allowed-origins: ${APP_CORS_ORIGINS:http://localhost:4200}
  uploads-dir: ${APP_UPLOADS_DIR:./data/uploads}
  encryption-key: ${APP_ENCRYPTION_KEY:}
  demo-mode: ${APP_DEMO_MODE:false}
  mail-from: ${APP_MAIL_FROM:LojaFácil <nao-responda@lojafacil.local>}
  payments:
    mercado-pago-api-base: ${MP_API_BASE:https://api.mercadopago.com}
    allow-live-transactions: ${APP_ALLOW_LIVE_PAYMENTS:false}
    reconcile-after-minutes: 10

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.hibernate.SQL: warn
